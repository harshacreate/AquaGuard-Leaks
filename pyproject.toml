[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="aquaguard-leaks"
version="0.1.0"
description="Identifies generated leak windows from pressure, flow, acoustic level, pipe age, night demand, and vibration. "
requires-python=">=3.9"
dependencies=["numpy==2.0.2","scikit-learn==1.6.1"]
[project.optional-dependencies]
test=["pytest==8.4.2"]
[tool.pytest.ini_options]
testpaths=["tests"]
